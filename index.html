<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Noor Quran Academy – أكاديمية نور القرآن</title>
<style>
:root{--g:#0f5c3a;--g2:#167a4d;--gold:#c9a227;--bg:#f6f4ec;--card:#fff;--tx:#1d2b24;--mu:#66756d;--bd:#e3dfcf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1814;--card:#16251e;--tx:#eaf1ec;--mu:#9bb0a4;--bd:#25382f}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:76px;line-height:1.5}
.ar{font-family:"Amiri","Scheherazade New","Noto Naskh Arabic",serif;direction:rtl}
header{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--gold)}
header b{font-size:15px;display:block}header .ar{font-size:18px;color:var(--gold)}
select{border-radius:8px;border:0;padding:6px;background:#fff;color:#0f5c3a;font-weight:600}
main{padding:14px;max-width:640px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h2{margin:0 0 8px;font-size:18px;color:var(--g)}h3{margin:0 0 6px;font-size:16px}
@media (prefers-color-scheme:dark){h2{color:var(--gold)}}
.mu{color:var(--mu);font-size:13px}
.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:15px;font-weight:600;cursor:pointer}
.btn.gold{background:var(--gold);color:#222}.btn.out{background:transparent;color:var(--g);border:1.5px solid var(--g)}
.btn:disabled{opacity:.5}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g2),var(--gold))}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{text-align:center}.stat b{font-size:22px;color:var(--g);display:block}
@media (prefers-color-scheme:dark){.stat b{color:var(--gold)}}
.item{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;background:var(--card);cursor:pointer;width:100%;text-align:start;color:var(--tx);font-size:15px}
.ic{width:40px;height:40px;border-radius:50%;background:var(--g);color:var(--gold);display:grid;place-items:center;font-size:20px;flex:none}
.ok{color:var(--g2);font-weight:700}
.ex{font-size:24px;line-height:2;background:rgba(201,162,39,.12);border-radius:10px;padding:6px 12px;margin:6px 0;text-align:center}
.L{display:grid;place-items:center;border:1px solid var(--bd);border-radius:10px;padding:6px 0;font-size:26px;cursor:pointer;background:var(--card);color:var(--tx)}
.L small{font-size:11px;color:var(--mu);font-family:system-ui}.L.on{background:var(--g);color:#fff}.L.on small{color:var(--gold)}
.opt{display:block;width:100%;text-align:start;padding:12px;margin:6px 0;border-radius:10px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px;cursor:pointer}
.opt.good{border-color:#1a9a57;background:rgba(26,154,87,.18)}.opt.bad{border-color:#c0392b;background:rgba(192,57,43,.15)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--gold);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;border:0;padding:9px 0 7px;font-size:11px;color:var(--mu);cursor:pointer}nav button span{display:block;font-size:20px}
nav button.on{color:var(--g);font-weight:700}@media (prefers-color-scheme:dark){nav button.on{color:var(--gold)}}
input[type=text]{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px}
.av{width:64px;height:64px;border-radius:50%;background:var(--gold);color:#222;display:grid;place-items:center;font-size:28px;font-weight:700;overflow:hidden;flex:none}.av img{width:100%;height:100%;object-fit:cover}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:start}
.pat{height:6px;background:repeating-linear-gradient(45deg,var(--gold) 0 6px,transparent 6px 12px);opacity:.5}
</style>
</head>

w:['Makhraj = bakka ba’umsaa; Sifa = amala qubee.','المخرج: موضع خروج الحرف؛ الصفة: كيفية النطق.','Makhraj = exit point; Sifa = quality of the letter.'],ex:['ء هـ ع ح غ خ','حروف الحلق'],p:['Qubeewwan qoonqoo ib hin cabsin dubbisi: ع ح غ خ.','انطق حروف الحلق بوضوح: ع ح غ خ.','Pronounce the throat letters clearly: ع ح غ خ.']},

function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function learn(){if(view)return lesson(view);
m.innerHTML=`<div class="card"><h2>${t('courses')}</h2>${CO.map((c,i)=>`<div class="item" style="cursor:default"><div class="ic">${c[0]}</div><div style="flex:1">${g(c[1])}</div><button class="btn ${S.enr[i]?'out':''}" onclick="enr(${i})">${S.enr[i]?t('enrolled'):t('enroll')}</button></div>`).join('')}</div>
<div class="card"><h2>${t('lessons')}</h2>${LS.map(l=>`<button class="item" onclick="go('learn','${l.id}')"><div class="ic ar">${l.ic}</div><div style="flex:1">${g(l.t)}</div><span class="ok">${S.done[l.id]?'✓':''}</span></button>`).join('')}</div>`}
function enr(i){S.enr[i]=!S.enr[i];sv();learn()}
function lesson(id){const l=LS.find(x=>x.id===id);S.last=id;sv();
m.innerHTML=`<button class="btn out" onclick="go('learn')">←</button><div class="card" style="margin-top:10px"><h2>${g(l.t)}</h2><p>${g(l.d)}</p>
${l.letters?`<p class="mu">${t('tap')}</p><div class="grid" id="lt">${LET.map((c,i)=>`<div class="L ar" onclick="pick(this,'${LN[i]}')">${c}<small></small></div>`).join('')}</div>`:''}
${g(l.w)?`<h3 style="margin-top:12px">${t('term')}</h3><p class="mu">${g(l.w)}</p>`:''}
<h3 style="margin-top:12px">${t('ex')}</h3>${(l.ex.length>1&&!l.letters?l.ex:[l.ex[0]]).map(x=>`<div class="ex ar">${x}</div>`).join('')}
<h3 style="margin-top:12px">${t('practice')}</h3><p>${g(l.p)}</p>
<button class="btn" ${S.done[id]?'disabled':''} onclick="fin('${id}')">${S.done[id]?t('marked'):t('mark')}</button></div>`}
function pick(el,n){document.querySelectorAll('#lt .L').forEach(x=>{x.classList.remove('on');x.querySelector('small').textContent=''});el.classList.add('on');el.querySelector('small').textContent=n}
function fin(id){S.done[id]=1;tick();lesson(id)}
function quiz(){if(!qs){const b=S.scores.length?Math.max(...S.scores):0;m.innerHTML=`<div class="card"><h2>${t('quiz')}</h2><p class="mu">${Q.length} · ${t('best')}: ${b}/${Q.length}</p><button class="btn" onclick="qs={i:0,s:0,a:null};quiz()">${t('start')}</button></div>`;return}
if(qs.i>=Q.length){m.innerHTML=`<div class="card" style="text-align:center"><h2>${t('score')}</h2><div style="font-size:42px;color:var(--gold);font-weight:800">${qs.s}/${Q.length}</div><button class="btn" onclick="qs=null;quiz()">${t('again')}</button></div>`;return}
const q=Q[qs.i];m.innerHTML=`<div class="card"><div class="mu">${qs.i+1}/${Q.length} · ${t('score')}: ${qs.s}</div><h3>${g(q.q)}</h3>${q.o.map((o,i)=>`<button class="opt ${qs.a!==null?(i===q.a?'good':i===qs.a?'bad':''):''}" ${qs.a!==null?'disabled':''} onclick="ans(${i})">${o}</button>`).join('')}
${qs.a!==null?`<p><b>${qs.a===q.a?t('correct'):t('wrong')}</b> ${g(q.e)}</p><button class="btn" onclick="qs.i++;qs.a=null;quiz()">${t('next')}</button>`:''}</div>`}
function ans(i){qs.a=i;if(i===Q[qs.i].a)qs.s++;if(qs.i===Q.length-1){S.scores.push(qs.s);tick()}quiz()}
function hifz(){const k=Object.keys(S.memo).length;
m.innerHTML=`<div class="card"><h2>${t('hifz')} / ${t('review')}</h2><div class="bar"><i style="width:${k/SU.length*100}%"></i></div><span class="mu">${k}/${SU.length}</span></div>`+SU.map((s,i)=>`<div class="card"><div class="row sp"><div><b class="ar" style="font-size:22px">سورة ${s[0]}</b><div class="mu">${s[1]} · ${s[2]}</div></div><button class="btn ${S.memo[i]?'out':''}" onclick="S.memo[${i}]=!S.memo[${i}];if(!S.memo[${i}])delete S.memo[${i}];sv();hifz()">${t('memo')}${S.memo[i]?' ✓':''}</button></div>
${S.memo[i]?`<div class="row sp" style="margin-top:8px"><span class="mu">${t('review')}: ${S.rev[i]||0} ${t('times')}</span><button class="btn gold" onclick="S.rev[${i}]=(S.rev[${i}]||0)+1;tick();hifz()">${t('review')}</button></div>`:''}</div>`).join('')}
function me(){const b=S.scores.length?Math.max(...S.scores):0,td=S.att.includes(day());
m.innerHTML=`<div class="card"><div class="row"><div class="av">${S.photo?`<img src="${S.photo}" alt="">`:(S.name||'N')[0].toUpperCase()}</div><div style="flex:1"><input type="text" id="nm" placeholder="${t('name')}" value="${esc(S.name)}"><label class="mu"><input type="file" accept="image/*" id="ph" style="display:none"><u>${t('photo')}</u></label></div></div>
<p><span class="mu">${t('role')}:</span> <select id="rl"><option value="student" ${S.role==='student'?'selected':''}>${t('student')}</option><option value="teacher" ${S.role==='teacher'?'selected':''}>${t('teacher')}</option></select>
&nbsp;<span class="mu">${t('goal')}:</span> <select id="gl">${[1,2,3,4,5].map(n=>`<option ${n===S.goal?'selected':''}>${n}</option>`).join('')}</select></p>
<button class="btn" onclick="S.name=document.getElementById('nm').value.trim();sv();me()">${t('save')}</button></div>
<div class="card"><h2>${t('attend')}</h2><p class="mu">🔥 ${streak()} · ${S.att.length}</p><button class="btn gold" ${td?'disabled':''} onclick="S.att.push(day());sv();me()">${td?'✓':t('checkin')}</button></div>
<div class="card"><h2>${t('report')}</h2><table><tr><td>${t('lvl')}</td><td>${g(U.lvn[lvl()])}</td></tr><tr><td>${t('done')}</td><td>${nDone()}/${LS.length}</td></tr><tr><td>${t('best')}</td><td>${b}/${Q.length}</td></tr><tr><td>${t('hifz')}</td><td>${Object.keys(S.memo).length}/${SU.length}</td></tr><tr><td>${t('courses')}</td><td>${Object.keys(S.enr).filter(k=>S.enr[k]).length}/${CO.length}</td></tr></table></div>
<div class="card"><h2>${t('sched')}</h2><table><tr><td>Mon · Wed</td><td>5:00 PM</td><td>${g(CO[1][1])}</td></tr><tr><td>Tue · Thu</td><td>6:00 PM</td><td>${g(CO[2][1])}</td></tr><tr><td>Sat</td><td>9:00 AM</td><td>${g(CO[3][1])}</td></tr></table></div>
${S.role==='teacher'?`<div class="card"><h2>${t('students')}</h2><table><tr><td>Hamza A.</td><td>5/7</td><td>5/6</td></tr><tr><td>Fatima M.</td><td>3/7</td><td>4/6</td></tr><tr><td>Abdulaziz T.</td><td>7/7</td><td>6/6</td></tr><tr><td>Amina K.</td><td>1/7</td><td>2/6</td></tr></table></div>`:''}
<div class="card"><h3>⚙️ ${t('backend')}</h3><ul class="mu" style="padding-inline-start:18px;margin:6px 0">
<li>Auth (login, roles: student/teacher/admin)</li><li>Database: users, lessons, quizzes, progress, attendance, schedule</li><li>Cloud sync of progress across devices</li><li>Audio recitation (CDN) + full Quran text/API</li><li>Real payments & teacher booking (when needed)</li><li>Push notifications for daily goals & classes</li></ul></div>`;
document.getElementById('rl').onchange=e=>{S.role=e.target.value;sv();me()};document.getElementById('gl').onchange=e=>{S.goal=+e.target.value;sv()};
document.getElementById('ph').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=96;const x=c.getContext('2d'),s=Math.min(im.width,im.height);x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,96,96);S.photo=c.toDataURL('image/jpeg',.7);sv();me()};im.src=r.result};r.readAsDataURL(f)}}
document.getElementById('lang').onchange=e=>{S.lang=e.target.value;sv();render()};
render();
</script>
</body>
</html>
