<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Noor Quran Academy</title>
<style>
:root{--g:#0f5132;--g2:#1b7a4b;--gold:#c9a227;--bg:#fbfaf4;--tx:#14331f;--mu:#6b7a6f;--ln:#e6e0c8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:system-ui,'Noto Naskh Arabic',sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column}
header{background:var(--g);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:3px solid var(--gold);display:flex;align-items:center;gap:8px}
header h1{flex:1;margin:0;font-size:17px}
header button{background:none;border:1px solid var(--gold);color:#fff;border-radius:6px;padding:4px 8px;font-size:12px}
header button.on{background:var(--gold);color:var(--g)}
main{flex:1;overflow-y:auto;padding:14px}
nav{display:flex;background:#fff;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:8px 2px;font-size:11px;color:var(--mu)}
nav button b{display:block;font-size:19px;font-weight:400}
nav button.on{color:var(--g);border-top:3px solid var(--gold);margin-top:-1px}
.card{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 6px;color:var(--g);font-size:16px}
.card p{margin:4px 0;font-size:14px;line-height:1.6}
.hero{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;border:0}
.hero h3{color:#fff}
.btn{display:inline-block;background:var(--gold);color:var(--g);border:0;border-radius:8px;padding:9px 16px;font-weight:700;font-size:14px;margin-top:8px}
.btn.done{background:#e3f1e8;color:var(--g)}
.btn.alt{background:var(--g);color:#fff}
.ar{font-family:'Amiri Quran','Noto Naskh Arabic','Traditional Arabic',serif;font-size:22px;direction:rtl;color:var(--g)}
.opt{display:block;width:100%;text-align:start;background:#fff;border:1px solid var(--ln);border-radius:8px;padding:10px;margin:6px 0;font-size:14px;color:var(--tx)}
.opt.ok{background:#e3f1e8;border-color:var(--g2)}.opt.no{background:#fbe9e7;border-color:#c0392b}
input{width:100%;padding:10px;border:1px solid var(--ln);border-radius:8px;font-size:15px}
.bar{height:8px;background:var(--ln);border-radius:4px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--gold)}
small{color:var(--mu)}
[dir=rtl] .card,[dir=rtl] main{text-align:right}
</style>
</head>
<body>
<header>
  <h1 id="ttl">نور القرآن · Noor Quran</h1>
  <button data-l="om">OM</button><button data-l="ar">ع</button><button data-l="en">EN</button>
</header>
<main id="m"></main>
<nav id="nav"></nav>

<script>
var T={
om:{app:"Noor Quran Academy",home:"Mana",courses:"Koorsii",tajwid:"Tajwiid",quiz:"Qormaata",teachers:"Barsiisota",me:"Koo",
 hi:"Assalaamu Alaykum",wel:"Qur'aana barachuu fi qara'uu asitti jalqabi.",read:"Qur'aana Qara'i",
 prog:"Koorsii galmaa'ame",enroll:"Galmaa'i",enrolled:"Galmaa'eerta ✓",
 c1:"Qara'uu jalqabaa",c1d:"Qubee Arabaa fi qara'uu bu'uuraa.",c2:"Tajwiid",c2d:"Seera qara'uu sirrii.",c3:"Hifz",c3d:"Qur'aana qalbii qabachuu.",c4:"Muraja'a",c4d:"Wanta qabatte irra deebi'uu.",c5:"Barsiisaa dhuunfaa",c5d:"Barumsa dhuunfaa barsiisaa waliin.",
 les:"Barnoota Tajwiid",qz:"Qormaata gabaabaa",score:"Qabxii",again:"Irra deebi'i",next:"Itti aanu",
 tcs:"Barsiisota",soon:"Dhiyeenyatti",name:"Maqaa kee",save:"Olkaa'i",saved:"Olkaa'ameera ✓",best:"Qabxii olaanaa",cnt:"Koorsii galmaa'ame",
 src:"Madda barreeffama Qur'aanaa:",
 t1:"Barsiisaa Tajwiid",t1d:"Seera qara'uu sirrii",t2:"Barsiisaa Hifz",t2d:"Qalbii qabachuu",t3:"Barsiisaa jalqabaa",t3d:"Qara'uu bu'uuraa"},
ar:{app:"أكاديمية نور القرآن",home:"الرئيسية",courses:"الدورات",tajwid:"التجويد",quiz:"اختبار",teachers:"المعلمون",me:"ملفي",
 hi:"السلام عليكم",wel:"ابدأ هنا تعلّم القرآن وقراءته.",read:"اقرأ القرآن",
 prog:"الدورات المسجّلة",enroll:"سجّل",enrolled:"تم التسجيل ✓",
 c1:"القراءة للمبتدئين",c1d:"الحروف العربية والقراءة الأساسية.",c2:"التجويد",c2d:"أحكام القراءة الصحيحة.",c3:"الحفظ",c3d:"حفظ القرآن الكريم.",c4:"المراجعة",c4d:"مراجعة المحفوظ.",c5:"معلم خاص",c5d:"دروس فردية مع معلم.",
 les:"دروس التجويد",qz:"اختبار قصير",score:"النتيجة",again:"أعد",next:"التالي",
 tcs:"المعلمون",soon:"قريباً",name:"اسمك",save:"حفظ",saved:"تم الحفظ ✓",best:"أعلى نتيجة",cnt:"الدورات المسجّلة",
 src:"مصدر نص القرآن:",
 t1:"معلم التجويد",t1d:"أحكام القراءة",t2:"معلم الحفظ",t2d:"حفظ القرآن",t3:"معلم المبتدئين",t3d:"القراءة الأساسية"},
en:{app:"Noor Quran Academy",home:"Home",courses:"Courses",tajwid:"Tajwid",quiz:"Quiz",teachers:"Teachers",me:"Me",
 hi:"Assalamu Alaykum",wel:"Start learning and reading the Quran here.",read:"Read the Quran",
 prog:"Enrolled courses",enroll:"Enroll",enrolled:"Enrolled ✓",
 c1:"Beginner reading",c1d:"Arabic letters and basic reading.",c2:"Tajwid",c2d:"Rules of correct recitation.",c3:"Hifz",c3d:"Memorizing the Quran.",c4:"Muraja'a",c4d:"Reviewing what you memorized.",c5:"Private teacher",c5d:"One-to-one lessons with a teacher.",
 les:"Tajwid lessons",qz:"Short quiz",score:"Score",again:"Try again",next:"Next",

 src:"Quran text source:",
 t1:"Tajwid teacher",t1d:"Recitation rules",t2:"Hifz teacher",t2d:"Memorization",t3:"Beginner teacher",t3d:"Basic reading"}
};
var LES=[
 {a:"النون الساكنة والتنوين",om:"Noon saakinaa fi tanwiin: seera afur qaba: Izhaar, Idghaam, Iqlaab, Ikhfaa.",ar:"للنون الساكنة والتنوين أربعة أحكام: الإظهار والإدغام والإقلاب والإخفاء.",en:"Noon sakinah and tanween have four rules: Izhar, Idgham, Iqlab, Ikhfa."},
 {a:"القلقلة",om:"Qalqalaa: qubeewwan 5: ق ط ب ج د. Yeroo sukuuniin dhaabbatan sagaleen isaanii ni jabaata (ni dhiibama).",ar:"القلقلة في خمسة أحرف: ق ط ب ج د (قطب جد) إذا سكنت.",en:"Qalqalah applies to five letters: ق ط ب ج د when they are sakin."},
 {a:"المد الطبيعي",om:"Maddii uumamaa: sagalee gabaabaa lama (harakaat 2) dheeressuu.",ar:"المد الطبيعي مقداره حركتان.",en:"Natural madd is held for two counts (harakat)."},
 {a:"الغنة",om:"Ghunnaa: noon fi meem mushaddad irratti harakaat 2 tahuun ni dheeraata.",ar:"الغنة في النون والميم المشددتين مقدارها حركتان.",en:"Ghunnah on shaddah noon and meem lasts two counts."}
];
var QZ=[
 {q:{om:"Qalqalaa qubeewwan kam irratti?",ar:"ما أحرف القلقلة؟",en:"Which letters have qalqalah?"},o:["ق ط ب ج د","ا و ي","س ش ص","م ن ل"],a:0},
 {q:{om:"Iqlaab: noon saakinaa ___ dura yoo dhufe gara meemitti jijjiirama.",ar:"الإقلاب: النون الساكنة قبل حرف ___ تقلب ميماً.",en:"Iqlab: noon sakinah before ___ turns into meem."},o:["ب","ت","د","ك"],a:0},
 {q:{om:"Maddii uumamaa hamma meeqaa?",ar:"كم مقدار المد الطبيعي؟",en:"How long is natural madd?"},o:["2","4","6","1"],a:0},
 {q:{om:"Noon saakinaa fi tanwiin seera meeqa qabu?",ar:"كم حكماً للنون الساكنة والتنوين؟",en:"How many rules for noon sakinah and tanween?"},o:["4","2","3","5"],a:0},
 {q:{om:"Ghunnaa hamma meeqaa?",ar:"كم مقدار الغنة؟",en:"How long is ghunnah?"},o:["2","1","4","6"],a:0}
];
var ord=null;
var L=localStorage.getItem("noor_lang")||"om",tab="home",qi=0,qs=0;
function t(k){return T[L][k]}
function get(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
function set(k,v){localStorage.setItem(k,JSON.stringify(v))}
var TABS=[["home","🏠"],["courses","📚"],["tajwid","📖"],["quiz","✍️"],["teachers","👤"],["me","⭐"]];
var CS=[1,2,3,4,5];

function draw(){
  document.documentElement.lang=L;document.documentElement.dir=L=="ar"?"rtl":"ltr";
  document.getElementById("ttl").textContent="نور القرآن · "+t("app");
  document.querySelectorAll("header button").forEach(function(b){b.className=b.dataset.l==L?"on":""});
  document.getElementById("nav").innerHTML=TABS.map(function(x){return '<button class="'+(x[0]==tab?"on":"")+'" data-t="'+x[0]+'"><b>'+x[1]+'</b>'+t(x[0])+'</button>'}).join("");
  var h="",en=get("noor_enrolled",[]);
  if(tab=="home"){
    h='<div class="card hero"><h3>'+t("hi")+(get("noor_name","")?", "+get("noor_name",""):"")+'</h3><p>'+t("wel")+'</p><button class="btn" id="rd">'+t("read")+' · القرآن الكريم</button></div>'+
      '<div class="card"><h3>'+t("prog")+'</h3><p>'+en.length+' / 5</p><div class="bar"><i style="width:'+en.length*20+'%"></i></div></div>'+
      '<p style="text-align:center"><small>'+t("src")+' <a href="https://tanzil.net" style="color:var(--g)">tanzil.net</a></small></p>';
  }else if(tab=="courses"){
    h=CS.map(function(i){var on=en.indexOf(i)>=0;return '<div class="card"><h3>'+t("c"+i)+'</h3><p>'+t("c"+i+"d")+'</p><button class="btn '+(on?"done":"")+'" data-c="'+i+'">'+(on?t("enrolled"):t("enroll"))+'</button></div>'}).join("");
  }else if(tab=="tajwid"){
    h='<h3 style="color:var(--g)">'+t("les")+'</h3>'+LES.map(function(x){return '<div class="card"><div class="ar">'+x.a+'</div><p>'+x[L]+'</p></div>'}).join("");
  }else if(tab=="quiz"){
    if(qi>=QZ.length){
      var b=Math.max(get("noor_best",0),qs);set("noor_best",b);
      h='<div class="card"><h3>'+t("score")+': '+qs+' / '+QZ.length+'</h3><button class="btn" id="re">'+t("again")+'</button></div>';
    }else{
      var q=QZ[qi];
      if(!ord||ord.qi!=qi){ord=[0,1,2,3].sort(function(){return Math.random()-.5});ord.qi=qi}
      h='<div class="card"><small>'+(qi+1)+' / '+QZ.length+'</small><h3>'+q.q[L]+'</h3>'+ord.map(function(i){return '<button class="opt" data-o="'+i+'">'+q.o[i]+'</button>'}).join("")+'</div>';
    }
  }else if(tab=="teachers"){
    h='<h3 style="color:var(--g)">'+t("tcs")+'</h3>'+[1,2,3].map(function(i){return '<div class="card"><h3>'+t("t"+i)+'</h3><p>'+t("t"+i+"d")+'</p><small>'+t("soon")+'</small></div>'}).join("");
  }else{
    h='<div class="card"><h3>'+t("name")+'</h3><input id="nm" value="'+(get("noor_name","")||"").replace(/"/g,"&quot;")+'"><button class="btn" id="sv">'+t("save")+'</button></div>'+
      '<div class="card"><p>'+t("best")+': <b>'+get("noor_best",0)+' / '+QZ.length+'</b></p><p>'+t("cnt")+': <b>'+en.length+' / 5</b></p></div>';
  }
  document.getElementById("m").innerHTML=h;
}
document.addEventListener("click",function(e){
  var el=e.target.closest("button");if(!el)return;
  if(el.dataset.l){L=el.dataset.l;localStorage.setItem("noor_lang",L);draw();return}
  if(el.dataset.t){tab=el.dataset.t;if(tab=="quiz"){qi=0;qs=0}draw();return}
  if(el.dataset.c){var i=+el.dataset.c,a=get("noor_enrolled",[]),p=a.indexOf(i);if(p>=0)a.splice(p,1);else a.push(i);set("noor_enrolled",a);draw();return}
  if(el.id=="rd"){if(window.QuranReader)QuranReader.open();else alert("quran-reader missing");return}
  if(el.id=="re"){qi=0;qs=0;draw();return}
  if(el.id=="sv"){set("noor_name",document.getElementById("nm").value.trim());el.textContent=t("saved");return}
  if(el.dataset.o!=null&&!el.disabled){
    var q=QZ[qi],ok=+el.dataset.o==q.a;if(ok)qs++;
    document.querySelectorAll(".opt").forEach(function(b){b.disabled=true;if(+b.dataset.o==q.a)b.className="opt ok";else if(b==el)b.className="opt no"});
    setTimeout(function(){qi++;draw()},900);
  }
});
draw();
</script>
<script>
/* Noor Quran Academy - Quran text reader (offline) */
(function () {
  var NAMES = ["الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس","هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه","الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم","لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر","فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق","الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج","نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس","التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد","الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات","القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر","المسد","الإخلاص","الفلق","الناس"];
  var BISMILLAH = "بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ";
  var KEY = "noor_quran_last";
  var data = null, root = null;

  var css = "#qr{position:fixed;inset:0;z-index:9999;background:#fbfaf4;color:#14331f;display:none;flex-direction:column;font-family:sans-serif}" +
    "#qr .bar{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#0f5132;color:#fff;border-bottom:3px solid #c9a227}" +
    "#qr .bar b{flex:1;font-size:18px}" +
    "#qr button{background:none;border:0;color:inherit;font-size:20px;padding:4px 10px}" +
    "#qr .body{flex:1;overflow-y:auto;padding:12px}" +
    "#qr .row{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid #e6e0c8;direction:rtl}" +
    "#qr .num{min-width:34px;height:34px;border:2px solid #c9a227;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#0f5132;font-size:14px;direction:ltr}" +
    "#qr .nm{flex:1;font-size:22px;font-family:'Amiri Quran','Noto Naskh Arabic','Traditional Arabic',serif}" +
    "#qr .ct{font-size:13px;color:#7a6a1f;direction:ltr}" +
    "#qr .txt{direction:rtl;text-align:justify;line-height:2.6;font-size:var(--qs,28px);font-family:'Amiri Quran','Noto Naskh Arabic','Traditional Arabic',serif}" +
    "#qr .bis{text-align:center;color:#0f5132;margin:10px 0 18px}" +
    "#qr .end{display:inline-flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;border:1.5px solid #c9a227;border-radius:50%;font-size:.5em;margin:0 .4em;color:#0f5132;font-family:sans-serif}";

  function el(t, c, h) { var e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; }
  function toAr(n) { return String(n).replace(/\d/g, function (d) { return "٠١٢٣٤٥٦٧٨٩"[d]; }); }

  function getText(u) {
    return new Promise(function (res, rej) {
      var x = new XMLHttpRequest();
      x.open("GET", u);
      x.onload = function () { (x.status === 200 || x.status === 0) && x.responseText ? res(x.responseText) : rej(new Error(u + " HTTP " + x.status)); };
      x.onerror = function () { rej(new Error(u + " not readable")); };
      x.send();
    });
  }

  function parse(t) {
    var s = {};
    t.split("\n").forEach(function (l) {
      if (!l || l[0] === "#") return;
      var p = l.split("|"); if (p.length < 3) return;
      var su = +p[0], ay = +p[1], tx = p.slice(2).join("|").trim();
      if (ay === 1 && su !== 1 && su !== 9) tx = tx.split(" ").slice(4).join(" ");
      (s[su] = s[su] || []).push(tx);
    });
    return s;
  }

  function load() {
    if (data) return Promise.resolve(data);
    return getText("quran-uthmani.txt")
      .catch(function () { return getText("quran-simple.txt"); })
      .then(function (t) { data = parse(t); if (!data[114]) throw new Error("bad data"); return data; });
  }

  function build() {
    if (root) return;
    var st = el("style", null, css); document.head.appendChild(st);
    root = el("div"); root.id = "qr"; document.body.appendChild(root);
  }

  function shell(title, back) {
    root.innerHTML = "";
    var bar = el("div", "bar");
    var b = el("button", null, back ? "←" : "✕"); b.onclick = back || close;
    bar.appendChild(b); bar.appendChild(el("b", null, title));
    var body = el("div", "body");
    root.appendChild(bar); root.appendChild(body);
    return { bar: bar, body: body };
  }

  function list() {
    var v = shell("القرآن الكريم · Qur'aana", null);
    for (var i = 1; i <= 114; i++) (function (n) {
      var r = el("div", "row", '<span class="num">' + n + '</span><span class="nm">سورة ' + NAMES[n - 1] + '</span><span class="ct">' + data[n].length + '</span>');
      r.onclick = function () { read(n); };
      v.body.appendChild(r);
    })(i);
    var last = +localStorage.getItem(KEY);
    if (last) read(last);
  }

  function read(n) {
    localStorage.setItem(KEY, n);
    var v = shell("سورة " + NAMES[n - 1], function () { localStorage.removeItem(KEY); list(); });
    var small = el("button", null, "A-"), big = el("button", null, "A+");
    var size = +localStorage.getItem("noor_quran_size") || 28;
    function apply() { v.body.style.setProperty("--qs", size + "px"); localStorage.setItem("noor_quran_size", size); }
    small.onclick = function () { size = Math.max(18, size - 2); apply(); };
    big.onclick = function () { size = Math.min(44, size + 2); apply(); };
    v.bar.appendChild(small); v.bar.appendChild(big); apply();
    if (n !== 1 && n !== 9) v.body.appendChild(el("div", "txt bis", BISMILLAH));
    var html = data[n].map(function (a, i) { return a + '<span class="end">' + toAr(i + 1) + "</span>"; }).join(" ");
    v.body.appendChild(el("div", "txt", html));
    v.body.scrollTop = 0;
  }

  function close() { root.style.display = "none"; }

  window.QuranReader = {
    open: function () {
      build(); root.style.display = "flex";
      root.innerHTML = '<div class="body">...</div>';
      load().then(list).catch(function (e) {
        root.innerHTML = '<div class="body">Qur\'aanni hin banamne / تعذر التحميل:<br><small>' + (e && e.message) + '</small><br><br><button onclick="QuranReader.close()">✕</button></div>';
      });
    },
    close: close
  };
})();

</script>
</body>
</html>
